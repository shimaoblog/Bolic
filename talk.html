<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>说说</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>说说 / Talk</h1>
  <nav style="margin-top:0.5rem;">
    <a href="index.html">← 返回首页</a>
  </nav>
</header>

<main id="talkList"></main>

<footer></footer>

<script src="js/main.js"></script>
<script>
(async ()=>{
  const talks = await loadTalks();
  const box = document.getElementById("talkList");
  talks.forEach(item => {
    box.innerHTML += `
      <div class="talk-item">
        <div class="meta">${item.time}</div>
        <div>${item.html}</div>
      </div>
    `
  })
})()
</script>
</body>
</html>
